[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"
[project]
name = "d4cnn-cpu-demo"
version = "0.1.0"
description = "Torch-free D4CNN CPU inference and AnaCal calibration demo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
pipeline = ["anacal", "astropy", "fitsio", "pandas", "scipy", "tqdm", "galsim"]
reference = ["torch", "torchvision"]
test = ["pytest>=7"]
[tool.scikit-build]
wheel.packages = []
build-dir = "build/{wheel_tag}"
wheel.exclude = ["**/build/**", "**/runs/**", "**/.build-tmp/**", "**/__pycache__/**"]
sdist.exclude = ["build", "runs", ".build-tmp", "__pycache__", "*.so"]
[tool.pytest.ini_options]
testpaths = ["tests"]
